<!DOCTYPE html>
<!--
  Plantilla de la vista previa social (og:image, 1200x630).
  Regenerar con el sitio servido en local (python3 -m http.server 8131):

    google-chrome --headless=new --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=3000 --screenshot=/tmp/og.png \
      http://127.0.0.1:8131/tools/og-card.html
    magick /tmp/og.png -strip -quality 86 assets/images/og-card.jpg
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0b1417;
    color: #ecf1f2;
    font-family: Manrope, system-ui, sans-serif;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 64px;
    align-items: center;
    padding: 0 76px;
    box-sizing: border-box;
    position: relative;
  }
  body::before {
    content: ''; position: absolute; top: -260px; left: -180px; width: 820px; height: 720px;
    border-radius: 50%; background: radial-gradient(closest-side, rgba(58,150,132,.22), transparent);
  }
  .text { position: relative; display: flex; flex-direction: column; gap: 22px; }
  .kicker { font-family: 'JetBrains Mono', monospace; font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: #68e4c6; }
  .name { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 34px; color: #b4bcbe; letter-spacing: -.02em; }
  h1 { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 58px; line-height: 1.04; letter-spacing: -.038em; text-wrap: balance; }
  .facts { display: flex; gap: 26px; align-items: center; font-size: 22px; font-weight: 600; margin-top: 6px; }
  .facts .ok { color: #68e4c6; }
  .facts .site { color: #959d9f; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 20px; }
  .photo { position: relative; width: 360px; height: 360px; border-radius: 28px; overflow: hidden; border: 2px solid #2f3a3d; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
  <div class="text">
    <div class="kicker">Full stack engineer · Backend · Cloud</div>
    <div class="name">José Chaparro</div>
    <h1>I build production software, and the infrastructure it runs on.</h1>
    <div class="facts"><span class="ok">✓ US citizen · open to remote</span><span class="site">josechaparro.com</span></div>
  </div>
  <div class="photo"><img src="../assets/images/jose-headshot-460.jpg" alt=""></div>
</body>
</html>
